name: Build TIKORA APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare website files
        run: |
          mkdir -p /tmp/tikora-site
          find www -type f -name index.html
          SOURCE=$(find www -type f -name index.html | head -n 1)
          if [ -z "$SOURCE" ]; then
            echo "HTML dosyasi bulunamadi"
            exit 1
          fi
          cp -a "$(dirname "$SOURCE")"/. /tmp/tikora-site/
          rm -rf www
          mkdir -p www
          cp -a /tmp/tikora-site/. www/
          test -s www/index.html

      - name: Configure Capacitor
        run: |
          node -e "const fs=require('fs');const p='capacitor.config.json';const c=JSON.parse(fs.readFileSync(p));c.webDir='www';fs.writeFileSync(p,JSON.stringify(c,null,2));"

      - name: Install dependencies
        run: npm install

      - name: Add Android
        run: npx cap add android

      - name: Sync Android
        run: npx cap sync android

      - name: Verify Android website
        run: |
          test -s android/app/src/main/assets/public/index.html

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TIKORA-APK
          path:path: android/app/build/outputs/apk/debug/app-debug.apk
